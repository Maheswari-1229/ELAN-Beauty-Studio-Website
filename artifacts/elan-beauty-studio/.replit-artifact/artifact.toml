kind = "web"
previewPath = "/"
title = "ÉLAN Beauty Studio"
description = "A polished, responsive salon website template for ÉLAN Beauty Studio, with editable client details, service discovery, gallery, testimonials, and appointment requests."
version = "1.0.0"
id = "artifacts/elan-beauty-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21703

[services.development]
run = "pnpm --filter @workspace/elan-beauty-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/elan-beauty-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/elan-beauty-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21703"
BASE_PATH = "/"
